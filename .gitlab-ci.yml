stages:          # List of stages for jobs, and their order of execution
  - build
  - deploy

services:
  - name: docker:dind
    command: ["--insecure-registry=192.168.107.22"]

before_script:
  - echo $HARBOR_USERNAME
  - echo $HARBOR_URL
  - echo $HARBOR_PROJECT
  - echo -n $HARBOR_PASSWORD | docker login $HARBOR_URL -u $HARBOR_USERNAME -p $HARBOR_PASSWORD
  - docker version
  - docker info

after_script:
  - docker logout $HARBOR_URL

build-job:
  stage: build
  script:
    - docker pull $HARBOR_URL/$HARBOR_PROJECT:latest || true
    - docker build --pull --cache-from $HARBOR_URL/$HARBOR_PROJECT:latest --tag $HARBOR_URL/$HARBOR_PROJECT:latest .

deploy-job:
  stage: deploy
  environment: production
  script:
    - docker push $HARBOR_URL/$HARBOR_PROJECT:latest
    - echo "Application successfully deployed."
