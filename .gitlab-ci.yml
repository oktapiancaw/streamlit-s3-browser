stages:
  - build

variables:
  DOCKER_DRIVER: overlay2


build-job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login $HARBOR_URL -u $HARBOR_USERNAME -p $HARBOR_PASSWORD
  script:
    - docker build --pull --tag $HARBOR_HOST/$HARBOR_PROJECT/s3-browser:latest .
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/s3-browser:latest
    - echo "Application successfully deployed."
  after_script:
    - docker logout $HARBOR_HOST

